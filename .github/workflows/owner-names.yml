name: Owner names

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Build
        continue-on-error: true
        run: |
          {
            set -e
            node tools/owner-names.js
            node tools/guard.js
            echo "== OK =="
          } > /tmp/run.log 2>&1

      - name: Commit
        if: always()
        run: |
          cp /tmp/run.log _run-log.txt 2>/dev/null || echo "no log" > _run-log.txt
          OK=no; grep -q "^== OK ==" _run-log.txt && OK=yes
          [ "$OK" = "yes" ] && rm -f _run-log.txt
          git config user.name  "murch-report-bot"
          git config user.email "murch-report-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          if [ "$OK" = "yes" ]; then
            git commit -m "Query register: Owner column always names a person"
          else
            git commit -m "Owner name change failed, run log only"
          fi
          git push origin main
          if [ "$OK" = "yes" ]; then git push --force origin main:gh-pages; else exit 1; fi
