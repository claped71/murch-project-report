name: Add gallery photos

# Temporary, one-shot. Pulls six frames from the internal dashboard repo, resizes
# each into the three variants the gallery's srcset expects, strips EXIF (the
# originals are geotagged), then runs tools/add-photos.js and the publish guard.
# Idempotent: re-running adds nothing. Delete this file, tools/add-photos.js and
# _run-log.txt once it has run.
#
# The whole job runs in one step and tees its output to _run-log.txt, which is
# committed even on failure — the run log is not readable from where this was
# authored, so the repo is the channel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the gallery
        id: build
        continue-on-error: true
        run: |
          set -x
          {
            echo "== node/npm =="
            node -v; npm -v
            echo "== clone dashboard =="
            git clone --quiet --depth 1 https://github.com/claped71/murch-dashboard.git /tmp/dashboard
            ls /tmp/dashboard/assets/recent/recent-45.jpg /tmp/dashboard/assets/recent/recent-21.jpg
            echo "== install sharp =="
            npm i --no-save sharp@0.33.5 2>&1 | tail -5
            echo "== resize =="
            node /tmp/resize.js
            echo "== add-photos =="
            node tools/add-photos.js
            echo "== guard =="
            node tools/guard.js
            echo "== OK =="
          } > /tmp/run.log 2>&1
          echo "exit=$?" >> /tmp/run.log
        env:
          NODE_OPTIONS: ""

      - name: Write the resize script
        if: always()
        run: |
          cat > /tmp/resize.js <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const NUMBERS = [45, 30, 32, 28, 23, 21];
          const VARIANTS = [['', 1200, 80], ['-md', 820, 74], ['-sm', 520, 68]];
          (async () => {
            for (const n of NUMBERS) {
              const src = '/tmp/dashboard/assets/recent/recent-' + n + '.jpg';
              if (!fs.existsSync(src)) throw new Error('missing source: ' + src);
              for (const [suffix, size, quality] of VARIANTS) {
                const out = 'assets/photo-' + n + suffix + '.jpg';
                await sharp(src)
                  .rotate()
                  .resize({ width: size, height: size, fit: 'inside', withoutEnlargement: true })
                  .jpeg({ quality, progressive: true })
                  .toFile(out);
                console.log(out + '  ' + Math.round(fs.statSync(out).size / 1024) + ' KB');
              }
            }
          })().catch(e => { console.error('RESIZE FAILED: ' + e.message); process.exit(1); });
          EOF
          echo "resize script written"

      - name: Retry the build now the script exists
        id: build2
        continue-on-error: true
        run: |
          {
            echo "== retry =="
            test -d /tmp/dashboard || git clone --quiet --depth 1 https://github.com/claped71/murch-dashboard.git /tmp/dashboard
            test -d node_modules/sharp || npm i --no-save sharp@0.33.5 2>&1 | tail -5
            node /tmp/resize.js
            node tools/add-photos.js
            node tools/guard.js
            echo "== OK =="
          } >> /tmp/run.log 2>&1
          echo "retry_exit=$?" >> /tmp/run.log

      - name: Commit whatever happened
        if: always()
        run: |
          cp /tmp/run.log _run-log.txt || echo "no log" > _run-log.txt
          rm -rf node_modules package.json package-lock.json
          git config user.name  "murch-report-bot"
          git config user.email "murch-report-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Site photos: gallery build run"
          git push origin main
          if grep -q "^== OK ==" _run-log.txt; then
            git push --force origin main:gh-pages
            echo "published"
          else
            echo "build did not reach OK — main updated with the log, live site untouched"
          fi
