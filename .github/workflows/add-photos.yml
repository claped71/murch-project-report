name: Add gallery photos

# Temporary, one-shot. Pulls six frames from the internal dashboard repo, resizes
# each into the three variants the gallery's srcset expects, strips EXIF (the
# originals are geotagged), then runs tools/add-photos.js and the publish guard.
# Idempotent: re-running adds nothing. Delete this file and tools/add-photos.js
# once it has run.
#
# Resizing uses sharp, not ImageMagick — `convert` is no longer present on the
# ubuntu-latest runner image.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch the dashboard
        run: git clone --quiet --depth 1 https://github.com/claped71/murch-dashboard.git /tmp/dashboard

      - name: Resize into the gallery variants
        run: |
          npm i --no-save --silent sharp@0.33.5
          cat > /tmp/resize.js <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          // recent-N in the dashboard becomes photo-N in the report.
          const NUMBERS = [45, 30, 32, 28, 23, 21];
          const VARIANTS = [['', 1200, 80], ['-md', 820, 74], ['-sm', 520, 68]];
          (async () => {
            for (const n of NUMBERS) {
              const src = '/tmp/dashboard/assets/recent/recent-' + n + '.jpg';
              if (!fs.existsSync(src)) throw new Error('missing source: ' + src);
              for (const [suffix, size, quality] of VARIANTS) {
                const out = 'assets/photo-' + n + suffix + '.jpg';
                await sharp(src)
                  .rotate()                                  // honour EXIF orientation
                  .resize({ width: size, height: size, fit: 'inside', withoutEnlargement: true })
                  .jpeg({ quality, progressive: true })      // sharp drops metadata by default
                  .toFile(out);
                const kb = Math.round(fs.statSync(out).size / 1024);
                console.log(out + '  ' + kb + ' KB');
              }
            }
          })().catch(e => { console.error(e.message); process.exit(1); });
          EOF
          node /tmp/resize.js

      - name: Add them to the gallery
        run: node tools/add-photos.js

      - name: Publish guard
        run: node tools/guard.js

      - name: Commit and push
        id: commit
        run: |
          git config user.name  "murch-report-bot"
          git config user.email "murch-report-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Site photos: widen the gallery to 13, covering piles, MV collection, quality and the substation building"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish to the live site
        if: steps.commit.outputs.changed == 'true'
        run: git push --force origin main:gh-pages

      - name: Summary
        if: always()
        run: |
          {
            echo "## Gallery"
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "Six photos added and published."
            else
              echo "No change — the gallery already held them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
