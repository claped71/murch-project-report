name: Add gallery photos

# Temporary, one-shot. Pulls six frames from the internal dashboard repo, resizes
# each into the three variants the gallery's srcset expects, strips EXIF (the
# originals are geotagged), then runs tools/add-photos.js and the publish guard.
# Idempotent: re-running adds nothing.
#
# The script is written INTO THE WORKSPACE, not /tmp: node resolves node_modules
# from the script's own directory, so a script in /tmp cannot require('sharp')
# however it was installed. The job tees to _run-log.txt and commits it even on
# failure, because the Actions log is not readable from where this was authored.
#
# Delete this file, tools/add-photos.js and _run-log.txt once it has run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write the resize script
        run: |
          cat > resize.js <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          // recent-N in the dashboard becomes photo-N in the report.
          const NUMBERS = [45, 30, 32, 28, 23, 21];
          const VARIANTS = [['', 1200, 80], ['-md', 820, 74], ['-sm', 520, 68]];
          (async () => {
            for (const n of NUMBERS) {
              const src = '/tmp/dashboard/assets/recent/recent-' + n + '.jpg';
              if (!fs.existsSync(src)) throw new Error('missing source: ' + src);
              for (const [suffix, size, quality] of VARIANTS) {
                const out = 'assets/photo-' + n + suffix + '.jpg';
                await sharp(src)
                  .rotate()                              // honour EXIF orientation
                  .resize({ width: size, height: size, fit: 'inside', withoutEnlargement: true })
                  .jpeg({ quality, progressive: true })  // sharp drops metadata by default
                  .toFile(out);
                console.log(out + '  ' + Math.round(fs.statSync(out).size / 1024) + ' KB');
              }
            }
          })().catch(e => { console.error('RESIZE FAILED: ' + e.message); process.exit(1); });
          EOF
          echo "written"

      - name: Build the gallery
        id: build
        continue-on-error: true
        run: |
          {
            set -e
            echo "== clone dashboard =="
            git clone --quiet --depth 1 https://github.com/claped71/murch-dashboard.git /tmp/dashboard
            echo "== install sharp =="
            npm i --no-save sharp@0.33.5 2>&1 | tail -3
            echo "== resize =="
            node ./resize.js
            echo "== add-photos =="
            node tools/add-photos.js
            echo "== guard =="
            node tools/guard.js
            echo "== OK =="
          } > /tmp/run.log 2>&1

      - name: Commit whatever happened
        if: always()
        run: |
          cp /tmp/run.log _run-log.txt 2>/dev/null || echo "no log produced" > _run-log.txt
          rm -rf node_modules package.json package-lock.json resize.js
          OK=no
          grep -q "^== OK ==" _run-log.txt && OK=yes
          if [ "$OK" = "yes" ]; then rm -f _run-log.txt; fi
          git config user.name  "murch-report-bot"
          git config user.email "murch-report-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          if [ "$OK" = "yes" ]; then
            git commit -m "Site photos: widen the gallery to 13, covering piles, MV collection, quality and the substation building"
          else
            git commit -m "Site photos: build failed, run log only"
          fi
          git push origin main
          if [ "$OK" = "yes" ]; then
            git push --force origin main:gh-pages
            echo "published"
          else
            echo "not published — live site untouched"
            exit 1
          fi
